
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wonder Coffee Menu</title>
<style>
body{margin:0;background:#fbf7ef;color:#302016;font-family:Arial,sans-serif}
header{background:#302016;color:white;text-align:center;padding:28px 15px}
header h1{font-family:Georgia,serif;color:#e5bd70;font-size:30px}
header p{color:#eee0cc}
button{padding:10px 16px;border:0;border-radius:20px;background:#d6a64e;color:#302016;font-weight:bold}
main{max-width:650px;margin:auto;padding:18px}
nav{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}
nav button{background:#eadfce}
nav button.active{background:#302016;color:white}
.item{background:white;border:1px solid #eadfce;border-radius:13px;padding:15px;margin:10px 0}
.item h3{margin:0 0 7px}
.price{font-weight:bold;color:#805324}
.info{color:#58734c;font-size:13px}
footer{text-align:center;background:#302016;color:white;padding:25px}
input{width:95%;padding:12px;border:1px solid #ddd;border-radius:10px}
</style>
</head>
<body>
<header>
<h1>☕ Wonder Coffee</h1>
<p>GOOD FOOD. GREAT VIBES.</p>
<h2 id="welcome">A little wonder in every cup.</h2>
<button onclick="language()">አማርኛ / English</button>
</header>
<main>
<p id="notice">Please order with our waiter.</p>
<input id="search" placeholder="Search menu..." oninput="show()">
<nav id="tabs"></nav>
<div id="menu"></div>
<p style="font-size:12px;color:#777">
Nutrition values are estimates for demonstration. Actual values depend on ingredients and portions.
</p>
</main>
<footer>
<h2>Wonder Coffee</h2>
Good Food. Great Vibes.<br>
Scan · Browse · Order with our waiter
</footer>
<script>
const data=[
["Coffee","Espresso","ኤስፕሬሶ",60,5,0.3],
["Coffee","Macchiato","ማኪያቶ",90,65,3],
["Coffee","Cappuccino","ካፑቺኖ",110,100,5],
["Coffee","Latte","ላቴ",120,150,7],
["Coffee","Americano","አሜሪካኖ",80,5,0.3],
["Meals","Chicken Fitness Bowl","የዶሮ ጤናማ ምግብ",420,520,42],
["Meals","Tuna Sandwich","ቱና ሳንድዊች",280,360,27],
["Meals","Omelette Breakfast","ኦምሌት ቁርስ",250,340,22],
["Healthy Fit","Boiled Eggs (2)","የተቀቀለ እንቁላል",100,155,13],
["Healthy Fit","Yogurt Bowl","የእርጎ ሳህን",180,200,15],
["Healthy Fit","Oats with Peanut Butter","አጃ ከኦቾሎኒ ቅቤ ጋር",160,380,16],
["Drinks","Banana Peanut Smoothie","የሙዝ ስሙዚ",220,310,11],
["Drinks","Fresh Orange Juice","የብርቱካን ጭማቂ",150,110,2],
["Drinks","Avocado Smoothie","የአቮካዶ ስሙዚ",230,280,6]
];
let cat="All",am=false;
function language(){
am=!am;
document.getElementById("welcome").textContent=am?"በእያንዳንዱ ኩባያ ልዩ ጣዕም።":"A little wonder in every cup.";
document.getElementById("notice").textContent=am?"እባክዎ ከአስተናጋጃችን ይዘዙ።":"Please order with our waiter.";
show();
}
function show(){
let cats=["All","Coffee","Meals","Healthy Fit","Drinks"];
document.getElementById("tabs").innerHTML=cats.map(c=>
`<button class="${cat===c?'active':''}" onclick="cat='${c}';show()">${c}</button>`).join("");
let q=document.getElementById("search").value.toLowerCase();
let list=data.filter(x=>(cat==="All"||x[0]===cat)&&
(x[1].toLowerCase().includes(q)||x[2].includes(q)));
document.getElementById("menu").innerHTML=list.map(x=>`
<div class="item">
<h3>${am?x[2]:x[1]}</h3>
<div class="info">${x[4]} kcal · ${x[5]}g protein</div>
<p class="price">${x[3]} ETB</p>
</div>`).join("")||"No items found";
}
show();
</script>
</body>
</html>
